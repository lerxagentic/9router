services:
  9router:
    image: 9router-custom:apikey-v2-port-20260823
    container_name: 9router
    restart: unless-stopped
    ports:
      - "127.0.0.1:20128:20128"
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
    volumes:
      - /opt/9router-new/data:/app/data
